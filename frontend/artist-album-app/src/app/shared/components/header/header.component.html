<nav class="bg-spotify-black border-b border-spotify-gray-light sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo e Título -->
      <a [routerLink]="['/dashboard']" class="flex items-center space-x-2 sm:space-x-3 cursor-pointer">
        <div class="w-9 h-9 sm:w-10 sm:h-10 bg-spotify-green rounded-full flex items-center justify-center hover:scale-110 transition-transform flex-shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6 text-spotify-black" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
          </svg>
        </div>
        <span class="text-base sm:text-xl font-bold text-spotify-white truncate">{{ title }}</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex space-x-1">
        <a [routerLink]="['/dashboard']"
           routerLinkActive="bg-spotify-gray-medium text-spotify-white"
           class="sidebar-link px-4 py-2 text-sm font-bold text-spotify-gray-lighter hover:text-spotify-white rounded-md transition">
          Dashboard
        </a>
        <a [routerLink]="['/artists']"
           routerLinkActive="bg-spotify-gray-medium text-spotify-white"
           class="sidebar-link px-4 py-2 text-sm font-bold text-spotify-gray-lighter hover:text-spotify-white rounded-md transition">
          Artistas
        </a>
        <a [routerLink]="['/albums']"
           routerLinkActive="bg-spotify-gray-medium text-spotify-white"
           class="sidebar-link px-4 py-2 text-sm font-bold text-spotify-gray-lighter hover:text-spotify-white rounded-md transition">
          Álbuns
        </a>
      </div>

      <!-- Desktop Right Side -->
      <div class="hidden lg:flex items-center space-x-3">
        <app-notification-bell *ngIf="showNotifications"></app-notification-bell>

        <div class="text-sm text-spotify-gray-lighter hidden xl:block">
          <span class="font-bold">Olá, <span class="text-spotify-green">{{ authService.getUsername() }}</span>!</span>
        </div>

        <button (click)="logout()"
                class="flex items-center space-x-2 px-3 py-2 text-sm text-spotify-white hover:text-spotify-green hover:bg-spotify-gray-medium rounded-full transition font-bold border border-spotify-gray-light hover:border-spotify-green">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          <span class="hidden xl:inline">Sair</span>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex lg:hidden items-center space-x-2">
        <app-notification-bell *ngIf="showNotifications"></app-notification-bell>

        <button (click)="toggleMobileMenu()"
                class="p-2 text-spotify-white hover:text-spotify-green hover:bg-spotify-gray-medium rounded-lg transition">
          <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div *ngIf="isMobileMenuOpen" class="lg:hidden border-t border-spotify-gray-light bg-spotify-gray-dark slide-in">
    <div class="px-4 py-3 space-y-2">
      <!-- User Info -->
      <div class="pb-3 border-b border-spotify-gray-light">
        <p class="text-sm text-spotify-gray-lighter">
          <span class="font-bold">Olá, <span class="text-spotify-green">{{ authService.getUsername() }}</span>!</span>
        </p>
      </div>

      <!-- Navigation Links -->
      <a [routerLink]="['/dashboard']"
         (click)="closeMobileMenu()"
         routerLinkActive="bg-spotify-gray-medium text-spotify-green"
         class="flex items-center space-x-3 px-4 py-3 text-spotify-gray-lighter hover:text-spotify-white hover:bg-spotify-gray-medium rounded-lg transition font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>Dashboard</span>
      </a>

      <a [routerLink]="['/artists']"
         (click)="closeMobileMenu()"
         routerLinkActive="bg-spotify-gray-medium text-spotify-green"
         class="flex items-center space-x-3 px-4 py-3 text-spotify-gray-lighter hover:text-spotify-white hover:bg-spotify-gray-medium rounded-lg transition font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>Artistas</span>
      </a>

      <a [routerLink]="['/albums']"
         (click)="closeMobileMenu()"
         routerLinkActive="bg-spotify-gray-medium text-spotify-green"
         class="flex items-center space-x-3 px-4 py-3 text-spotify-gray-lighter hover:text-spotify-white hover:bg-spotify-gray-medium rounded-lg transition font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
        </svg>
        <span>Álbuns</span>
      </a>

      <!-- Logout Button -->
      <button (click)="logout()"
              class="flex items-center space-x-3 w-full px-4 py-3 text-red-400 hover:text-red-300 hover:bg-spotify-gray-medium rounded-lg transition font-bold mt-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </div>
</nav>
