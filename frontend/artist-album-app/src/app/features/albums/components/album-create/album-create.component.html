<app-header title="Acervo Musical"></app-header>

<div class="min-h-screen bg-gradient-to-br from-spotify-black via-spotify-gray-dark to-spotify-black">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8 fade-in">
      <button
        (click)="cancel()"
        class="mb-4 px-4 py-2 bg-spotify-gray-medium hover:bg-spotify-gray-light text-spotify-white rounded-lg transition-all font-bold shadow-spotify border border-spotify-gray-light flex items-center gap-2"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Voltar
      </button>

      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-spotify-green/20 rounded-full flex items-center justify-center border-2 border-spotify-green/30">
          <svg class="h-8 w-8 text-spotify-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-4xl font-bold text-spotify-white mb-2">Novo Álbum</h1>
          <p class="text-spotify-gray-lighter font-medium">Adicione um novo álbum à sua coleção</p>
        </div>
      </div>
    </div>

    <!-- Form Card -->
    <div class="card p-8 bg-spotify-gray-medium border-2 border-spotify-gray-light rounded-xl shadow-spotify fade-in !overflow-visible">
      <div class="space-y-6">
        <!-- Upload de Capas -->
        <div>
          <label class="block text-sm font-bold text-spotify-white mb-3">
            Capas do Álbum
            <span class="text-spotify-text-muted text-xs ml-2">({{ coverPreviews.length }} selecionada{{ coverPreviews.length !== 1 ? 's' : '' }})</span>
          </label>

          <!-- Upload Area -->
          <div class="border-2 border-dashed border-spotify-gray-light rounded-xl p-8 text-center hover:border-spotify-green hover:bg-spotify-gray-dark/50 transition-all cursor-pointer group"
               (click)="coverFileInput.click()">
            <svg class="h-16 w-16 mx-auto text-spotify-gray-lighter group-hover:text-spotify-green transition mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <p class="text-spotify-white font-bold mb-2">Clique para selecionar capas</p>
            <p class="text-sm text-spotify-gray-lighter">ou arraste e solte aqui (múltiplas imagens)</p>
            <p class="text-xs text-spotify-text-muted mt-2">PNG, JPG até 10MB cada</p>
          </div>

          <!-- Grid de Previews -->
          <div *ngIf="coverPreviews.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mt-4">
            <div *ngFor="let preview of coverPreviews; let i = index" class="relative group aspect-square">
              <img [src]="preview" [alt]="'Preview ' + (i + 1)" class="w-full h-full object-cover rounded-lg border-2 border-spotify-gray-light">
              <button
                type="button"
                (click)="removeCoverPreview(i)"
                class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                title="Remover"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <input
            #coverFileInput
            type="file"
            accept="image/*"
            multiple
            (change)="onCoverFileSelected($event)"
            class="hidden"
          />
        </div>

        <!-- Título -->
        <div>
          <label class="block text-sm font-bold text-spotify-white mb-2">Título *</label>
          <input
            [(ngModel)]="newAlbum.title"
            type="text"
            minlength="3"
            class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
            placeholder="Nome do álbum (mínimo 3 caracteres)"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Ano de Lançamento -->
          <div>
            <label class="block text-sm font-bold text-spotify-white mb-2">Ano de Lançamento</label>
            <input
              [(ngModel)]="newAlbum.releaseYear"
              type="number"
              min="1900"
              max="2100"
              class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
              placeholder="2024"
            />
          </div>

          <!-- Gênero Musical -->
          <div>
            <label class="block text-sm font-bold text-spotify-white mb-2">Gênero Musical</label>
            <input
              [(ngModel)]="newAlbum.genre"
              type="text"
              class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
              placeholder="Ex: Rock, Pop, Sertanejo"
            />
          </div>
        </div>

        <!-- Gravadora -->
        <div>
          <label class="block text-sm font-bold text-spotify-white mb-2">Gravadora</label>
          <input
            [(ngModel)]="newAlbum.recordLabel"
            type="text"
            class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
            placeholder="Ex: Universal Music, Sony Music"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Total de Faixas -->
          <div>
            <label class="block text-sm font-bold text-spotify-white mb-2">Total de Faixas</label>
            <input
              [(ngModel)]="newAlbum.totalTracks"
              type="number"
              min="1"
              class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
              placeholder="12"
            />
          </div>

          <!-- Duração Total -->
          <div>
            <label class="block text-sm font-bold text-spotify-white mb-2">Duração Total (segundos)</label>
            <input
              [(ngModel)]="newAlbum.totalDurationSeconds"
              type="number"
              min="1"
              class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
              placeholder="2400"
            />
          </div>
        </div>

        <!-- Artistas Multi-Select -->
        <div>
          <label class="block text-sm font-bold text-spotify-white mb-2 flex items-center gap-2">
            <svg class="h-5 w-5 text-spotify-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            Artistas *
            <span class="text-spotify-text-muted text-xs ml-2">({{ selectedArtistIds.size }} selecionado{{ selectedArtistIds.size !== 1 ? 's' : '' }})</span>
          </label>

          <!-- Selected Artists Chips -->
          <div *ngIf="selectedArtistIds.size > 0" class="flex flex-wrap gap-2 mb-3">
            <div *ngFor="let artist of getSelectedArtists()"
                 class="inline-flex items-center gap-2 px-3 py-1.5 bg-spotify-green/20 border border-spotify-green/30 rounded-full text-sm text-spotify-white">
              <span>{{ artist.name }}</span>
              <button
                type="button"
                (click)="toggleArtistSelection(artist.id)"
                class="hover:bg-spotify-green/30 rounded-full p-0.5 transition"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Dropdown Multi-Select -->
          <div class="relative">
            <button
              type="button"
              (click)="showArtistDropdown = !showArtistDropdown"
              class="w-full px-4 py-3 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all text-left flex items-center justify-between"
            >
              <span *ngIf="selectedArtistIds.size === 0" class="text-spotify-text-muted">Selecione um ou mais artistas</span>
              <span *ngIf="selectedArtistIds.size > 0" class="text-spotify-white">
                {{ selectedArtistIds.size }} artista{{ selectedArtistIds.size !== 1 ? 's' : '' }} selecionado{{ selectedArtistIds.size !== 1 ? 's' : '' }}
              </span>
              <svg class="h-5 w-5 text-spotify-gray-lighter transition-transform" [class.rotate-180]="showArtistDropdown" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div
              *ngIf="showArtistDropdown"
              class="absolute z-50 w-full mt-2 bg-spotify-gray-dark border border-spotify-gray-light rounded-lg shadow-2xl max-h-60 overflow-y-auto"
            >
              <div class="p-2 space-y-1">
                <button
                  *ngFor="let artist of artists"
                  type="button"
                  (click)="toggleArtistSelection(artist.id)"
                  class="w-full px-3 py-2 text-left hover:bg-spotify-gray-medium rounded-lg transition flex items-center justify-between"
                >
                  <span class="text-spotify-white">{{ artist.name }}</span>
                  <svg
                    *ngIf="isArtistSelected(artist.id)"
                    class="h-5 w-5 text-spotify-green flex-shrink-0"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                  </svg>
                </button>
                <div *ngIf="artists.length === 0" class="text-sm text-spotify-text-muted text-center py-4">
                  Nenhum artista disponível
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-6 border-t-2 border-spotify-gray-light">
          <button
            (click)="cancel()"
            class="btn-secondary px-8"
          >
            Cancelar
          </button>
          <button
            (click)="createAlbum()"
            [disabled]="loading || !newAlbum.title || newAlbum.title.trim().length < 3 || selectedArtistIds.size === 0"
            [class.opacity-50]="loading || !newAlbum.title || newAlbum.title.trim().length < 3 || selectedArtistIds.size === 0"
            [class.cursor-not-allowed]="loading || !newAlbum.title || newAlbum.title.trim().length < 3 || selectedArtistIds.size === 0"
            class="btn-primary px-8 flex items-center gap-2"
          >
            <svg *ngIf="!loading" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <div *ngIf="loading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
            {{ loading ? 'Criando...' : 'Criar Álbum' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
