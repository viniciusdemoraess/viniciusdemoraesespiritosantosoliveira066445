<div class="min-h-screen bg-spotify-black">
  <!-- Reusable Header Component -->
  <app-header title="Acervo Musical" [showNotifications]="true"></app-header>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-6 fade-in">
      <h1 class="text-3xl font-bold text-spotify-white mb-2">
        Galeria de Álbuns
      </h1>
      <p class="text-gray-600">Explore e gerencie sua coleção musical</p>
    </div>

    <!-- Search and Actions Bar -->
    <div class="card p-6 mb-6 fade-in">
      <div class="flex flex-col gap-4">
        <!-- Search and Add Row -->
        <div class="flex flex-col md:flex-row gap-4">
          <!-- Search Input -->
          <div class="flex-1 relative">
            <input
              type="text"
              [(ngModel)]="searchTerm"
              (keyup.enter)="onSearch()"
              (input)="onSearch()"
              placeholder="Buscar álbuns por título ou artista..."
              class="w-full px-4 py-3 pr-20 bg-spotify-gray-dark border border-spotify-gray-light text-spotify-white rounded-lg focus:outline-none focus:border-spotify-green hover:border-spotify-gray-lighter transition-all placeholder:text-spotify-text-muted"
            />
            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex gap-1">
              <button
                *ngIf="searchTerm"
                (click)="clearSearch()"
                class="text-spotify-gray-lighter hover:text-red-500 transition"
                title="Limpar busca"
              >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
              <button
                (click)="onSearch()"
                class="text-spotify-gray-lighter hover:text-spotify-green transition"
                title="Buscar"
              >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Add Button -->
          <button
            (click)="openAddModal()"
            class="btn-primary flex items-center justify-center space-x-2 px-6 whitespace-nowrap"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>Novo Álbum</span>
          </button>
        </div>

        <!-- Sort Controls -->
        <div class="flex flex-wrap items-center gap-3 text-sm">
          <span class="text-spotify-white font-bold">Ordenar por:</span>
          <div class="flex gap-2">
            <button
              (click)="setSortBy('title')"
              [class.bg-spotify-green]="sortBy === 'title'"
              [class.text-spotify-black]="sortBy === 'title'"
              [class.bg-spotify-gray-medium]="sortBy !== 'title'"
              [class.text-spotify-white]="sortBy !== 'title'"
              [class.border-spotify-green]="sortBy === 'title'"
              [class.border-spotify-gray-light]="sortBy !== 'title'"
              class="px-4 py-2 hover:bg-spotify-gray-light rounded-lg transition-all font-bold border shadow-spotify"
            >
              Título
            </button>
            <button
              (click)="setSortBy('year')"
              [class.bg-spotify-green]="sortBy === 'year'"
              [class.text-spotify-black]="sortBy === 'year'"
              [class.bg-spotify-gray-medium]="sortBy !== 'year'"
              [class.text-spotify-white]="sortBy !== 'year'"
              [class.border-spotify-green]="sortBy === 'year'"
              [class.border-spotify-gray-light]="sortBy !== 'year'"
              class="px-4 py-2 hover:bg-spotify-gray-light rounded-lg transition-all font-bold border shadow-spotify"
            >
              Ano
            </button>
            <button
              (click)="setSortBy('artist')"
              [class.bg-spotify-green]="sortBy === 'artist'"
              [class.text-spotify-black]="sortBy === 'artist'"
              [class.bg-spotify-gray-medium]="sortBy !== 'artist'"
              [class.text-spotify-white]="sortBy !== 'artist'"
              [class.border-spotify-green]="sortBy === 'artist'"
              [class.border-spotify-gray-light]="sortBy !== 'artist'"
              class="px-4 py-2 hover:bg-spotify-gray-light rounded-lg transition-all font-bold border shadow-spotify"
            >
              Artista
            </button>
          </div>
          <button
            (click)="toggleSortDirection()"
            class="flex items-center gap-2 px-4 py-2 bg-spotify-gray-medium hover:bg-spotify-gray-light text-spotify-white rounded-lg transition-all font-bold border border-spotify-gray-light shadow-spotify"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path *ngIf="sortDirection === 'asc'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
              <path *ngIf="sortDirection === 'desc'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4"></path>
            </svg>
            <span>{{ sortDirection === 'asc' ? 'Crescente' : 'Decrescente' }}</span>
          </button>

          <!-- Clear Filters Button -->
          <button
            *ngIf="showClearFiltersButton"
            (click)="clearFilters()"
            class="flex items-center gap-2 px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition font-medium"
            title="Limpar todos os filtros"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            <span>Limpar Filtros</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
    </div>

    <!-- Albums Grid with Modern Cards -->
    <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 fade-in">
      <div *ngFor="let album of albums" class="card p-0 overflow-hidden hover:shadow-lg transition-shadow group">
        <!-- Album Cover -->
        <div class="relative aspect-square bg-gray-100">
          <img
            *ngIf="album.covers.length > 0"
            [src]="album.covers[0].url"
            [alt]="album.title"
            class="w-full h-full object-cover"
          />
          <div
            *ngIf="album.covers.length === 0"
            class="w-full h-full bg-spotify-gray-dark flex items-center justify-center border-2 border-dashed border-spotify-gray-light"
          >
            <svg class="h-20 w-20 text-spotify-gray-lighter" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </div>

          <!-- Overlay with Actions -->
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 p-4">
            <button
              (click)="editAlbum(album)"
              class="px-4 py-2 bg-spotify-green hover:bg-spotify-green-dark text-spotify-black rounded-lg transition font-bold flex items-center gap-2"
              title="Editar Álbum"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
              Editar
            </button>
            <button
              (click)="deleteAlbum(album)"
              class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition font-bold flex items-center gap-2"
              title="Deletar Álbum"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
              Deletar
            </button>
          </div>
        </div>

        <!-- Album Info -->
        <div class="p-4">
          <h3 class="text-lg font-bold text-spotify-white mb-1 truncate">{{ album.title }}</h3>
          <p class="text-gray-600 text-sm mb-3">
            {{ album.artistName }} • {{ album.releaseYear }}
          </p>
          <span class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded">
            {{ album.covers.length }} {{ album.covers.length === 1 ? 'capa' : 'capas' }}
          </span>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="albums.length === 0" class="col-span-full empty-state">
        <svg class="h-16 w-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
        </svg>
        <h3 class="text-xl font-semibold text-spotify-white mb-2">Nenhum álbum encontrado</h3>
        <p class="text-gray-600 mb-4">Comece adicionando seu primeiro álbum</p>
        <button (click)="openAddModal()" class="btn-primary">
          Adicionar Primeiro Álbum
        </button>
      </div>
    </div>

    <!-- Pagination Component -->
    <app-pagination
      *ngIf="!loading && totalItems > 0"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [totalItems]="totalItems"
      [searchInfo]="searchInfo"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
